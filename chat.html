<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIO chat</title>
  <link rel="stylesheet" href="style_chat.css">
</head>
<body>
  <div class="chat-container">
    <h1>BIO chat</h1>
    <h1>質問一覧</h1>
    <div id="explain"><p>あなたが気になる質問はあるでしょうか？</p></div>
    <div id="question-list"></div>
  
    <h2>新しい質問</h2>
    <div id="explain"><p>疑問に思ったことを投稿してみましょう！</p></div>
    <input id="question-title" placeholder="タイトル">
    <textarea id="question-body" placeholder="質問内容"></textarea>
    <input id="asker-name" placeholder="名前"><!--aaa-->
    <button id="post-question">質問を投稿</button>
    <div class="back">
      <a href="index.html">ホーム画面へ戻る</a>
    </div>
  </div>
  <footer id="footer">
    <p>BIO watch | 身近な自然から、生物多様性を見つめる</p>
    <p>© 2026 Kabosu Brothers</p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
