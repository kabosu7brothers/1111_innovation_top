<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIO chat-質問詳細</title>
  <link rel="stylesheet" href="style_chat.css">
</head>
<body>
  <div class="chat-container">
    <h2>BIO chat</h2>
    <h2>質問</h2>
    <div id="question-detail"></div>
    <h2>回答一覧</h2>
    <div id="answer-list"></div>
  
    <h2>回答する</h2>
    <div id="explain"><p>回答を投稿してみましょう！</p></div>
    <textarea id="answer-body" placeholder="回答内容"></textarea>
    <input id="responder-name" placeholder="名前">
    <button id="post-answer">回答を投稿</button>
    <div class="back">
      <a href="index.html">ホーム画面へ戻る</a>
    </div>
  </div>
  <footer id="footer">
    <p>BIO watch | 身近な自然から、生物多様性を見つめる</p>
    <p>© 2026 Kabosu Brothers</p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
